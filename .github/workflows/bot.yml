name: Claude Referral Hunter

on:
  schedule:
    # Restart otomatis setiap 6 jam (setelah sesi 5.5 jam selesai, ada jeda 30 menit)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 5h 50m — lebih dari cukup untuk 5.5 jam sesi
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "python-telegram-bot>=21.0" "aiohttp>=3.9.0" "beautifulsoup4>=4.12.0" "lxml>=5.0.0"

      - name: Run Claude Referral Hunter
        run: python main.py
        env:
          PYTHONUTF8: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DEFAULT_CHAT_ID: ${{ secrets.DEFAULT_CHAT_ID }}
          MAX_RUNTIME: "19800"   # 5.5 jam dalam detik

      - name: Commit updated database
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add claude_referrals.db 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "DB update $(date '+%Y-%m-%d %H:%M')" && git push) || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
