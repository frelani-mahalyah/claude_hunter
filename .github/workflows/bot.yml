name: Claude Referral Hunter

on:
  schedule:
    # Backup trigger otomatis setiap 6 jam
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "python-telegram-bot>=21.0" "aiohttp>=3.9.0" "beautifulsoup4>=4.12.0" "lxml>=5.0.0" "requests>=2.31.0"

      - name: Run Yokgas Hunter Bot (Claude & Gemini 24/7)
        run: python main.py
        env:
          PYTHONUTF8: "1"
          GITHUB_ACTIONS: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DEFAULT_CHAT_ID: ${{ secrets.DEFAULT_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MAX_RUNTIME: "18900"   # 5 jam 15 menit, lalu auto-dispatch sesi baru

      - name: Commit updated database
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add claude_referrals.db 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Auto DB update $(date '+%Y-%m-%d %H:%M')" && git push) || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
